<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DocGen</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>tailwind.config = { darkMode: 'class' }</script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/ag-grid-community@31/styles/ag-grid.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/ag-grid-community@31/styles/ag-theme-quartz.css">
<script src="https://cdn.jsdelivr.net/npm/ag-grid-community@31/dist/ag-grid-community.min.noStyle.js"></script>
<script src="https://cdn.jsdelivr.net/npm/ag-charts-community@10/dist/umd/ag-charts-community.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<style>
  @media print { .no-print{display:none!important} body{background:#fff!important} #printArea{box-shadow:none!important;margin:0!important} }
  .page-a4{width:210mm;min-height:297mm;margin:0 auto;background:#fff;box-shadow:0 0 10px rgba(0,0,0,.15)}
  ::-webkit-scrollbar{width:8px;height:8px} ::-webkit-scrollbar-thumb{background:#9ca3af;border-radius:4px}
</style>
</head>
<body class="bg-gray-100 dark:bg-gray-900 text-gray-800 dark:text-gray-100 transition-colors">

<!-- LOGIN VIEW -->
<div id="loginView" class="min-h-screen flex items-center justify-center p-4">
  <div class="w-full max-w-sm bg-white dark:bg-gray-800 rounded-2xl shadow-xl p-8">
    <div class="text-center mb-6">
      <div id="loginLogo" class="w-14 h-14 mx-auto rounded-xl bg-indigo-600 flex items-center justify-center text-white text-2xl font-bold mb-3">D</div>
      <h1 id="loginTitle" class="text-lg font-bold">DocGen</h1>
      <p class="text-xs text-gray-500 dark:text-gray-400">Generator Dokumen Pengembangan Sistem</p>
    </div>
    <div class="space-y-3">
      <input id="loginUsername" placeholder="Username" class="w-full px-3 py-2 rounded-lg border dark:bg-gray-700 dark:border-gray-600 text-sm">
      <input id="loginPassword" type="password" placeholder="Password" class="w-full px-3 py-2 rounded-lg border dark:bg-gray-700 dark:border-gray-600 text-sm">
      <button id="btnLogin" class="w-full py-2 rounded-lg bg-indigo-600 hover:bg-indigo-700 text-white text-sm font-semibold transition">Masuk</button>
    </div>
    <button id="btnToggleDarkLogin" class="mt-4 text-xs text-gray-500 dark:text-gray-400 mx-auto block">🌓 Ubah Tema</button>
  </div>
</div>

<!-- MAIN VIEW -->
<div id="mainView" class="hidden min-h-screen flex">
  <!-- SIDEBAR -->
  <aside id="sidebar" class="fixed lg:static z-30 -translate-x-full lg:translate-x-0 transition-transform w-64 h-screen bg-white dark:bg-gray-800 border-r dark:border-gray-700 flex flex-col">
    <div class="p-4 flex items-center gap-2 border-b dark:border-gray-700">
      <div class="w-9 h-9 rounded-lg bg-indigo-600 flex items-center justify-center text-white font-bold">D</div>
      <span id="sideTitle" class="font-bold text-sm">DocGen</span>
    </div>
    <nav id="sideNav" class="flex-1 overflow-y-auto p-3 space-y-1 text-sm"></nav>
    <div class="p-3 border-t dark:border-gray-700 text-xs">
      <div id="userBadge" class="mb-2 font-medium"></div>
      <button id="btnLogout" class="w-full py-1.5 rounded-lg bg-red-50 dark:bg-red-900/30 text-red-600 dark:text-red-400 font-semibold">Keluar</button>
    </div>
  </aside>
  <div id="sidebarOverlay" class="hidden fixed inset-0 bg-black/40 z-20 lg:hidden"></div>

  <!-- CONTENT -->
  <div class="flex-1 flex flex-col min-w-0">
    <header class="bg-white dark:bg-gray-800 border-b dark:border-gray-700 px-4 py-3 flex items-center justify-between no-print">
      <div class="flex items-center gap-3">
        <button id="btnHamburger" class="lg:hidden text-xl">☰</button>
        <h2 id="pageTitle" class="font-bold text-base">Dashboard</h2>
      </div>
      <button id="btnToggleDark" class="text-lg">🌓</button>
    </header>

    <main class="flex-1 overflow-y-auto p-4 lg:p-6">

      <!-- DASHBOARD -->
      <section id="view-dashboard" class="space-y-4">
        <div id="statCards" class="grid grid-cols-2 lg:grid-cols-4 gap-3"></div>
        <div class="grid grid-cols-1 lg:grid-cols-2 gap-4">
          <div class="bg-white dark:bg-gray-800 rounded-xl p-4 shadow"><div id="chartByStatus" style="height:280px"></div></div>
          <div class="bg-white dark:bg-gray-800 rounded-xl p-4 shadow"><div id="chartByType" style="height:280px"></div></div>
        </div>
        <div class="bg-white dark:bg-gray-800 rounded-xl p-4 shadow">
          <h3 class="font-semibold text-sm mb-2">Dokumen Terbaru</h3>
          <div id="recentDocs" class="text-sm divide-y dark:divide-gray-700"></div>
        </div>
      </section>

      <!-- DOCUMENTS LIST -->
      <section id="view-documents" class="hidden space-y-3">
        <div class="flex flex-wrap items-center gap-2 justify-between">
          <div class="flex gap-2">
            <select id="filterDocType" class="px-3 py-1.5 rounded-lg border dark:bg-gray-700 dark:border-gray-600 text-sm"><option value="">Semua Jenis</option></select>
            <select id="filterStatus" class="px-3 py-1.5 rounded-lg border dark:bg-gray-700 dark:border-gray-600 text-sm">
              <option value="">Semua Status</option><option>Draft</option><option>Review</option><option>Approved</option><option>Rejected</option><option>Released</option>
            </select>
          </div>
          <button id="btnNewDoc" class="px-4 py-1.5 rounded-lg bg-indigo-600 text-white text-sm font-semibold">+ Dokumen Baru</button>
        </div>
        <div id="gridDocuments" class="ag-theme-quartz" style="height:520px;width:100%"></div>
      </section>

      <!-- DOCUMENT FORM -->
      <section id="view-form" class="hidden space-y-4 max-w-3xl">
        <div class="bg-white dark:bg-gray-800 rounded-xl p-4 shadow space-y-3">
          <select id="formDocType" class="w-full px-3 py-2 rounded-lg border dark:bg-gray-700 dark:border-gray-600 text-sm"></select>
          <input id="formTitle" placeholder="Judul Dokumen" class="w-full px-3 py-2 rounded-lg border dark:bg-gray-700 dark:border-gray-600 text-sm">
          <input id="formProject" placeholder="Nama Proyek" class="w-full px-3 py-2 rounded-lg border dark:bg-gray-700 dark:border-gray-600 text-sm">
        </div>
        <div id="formSections" class="space-y-3"></div>
        <div class="flex gap-2">
          <button id="btnSaveDoc" class="px-4 py-2 rounded-lg bg-indigo-600 text-white text-sm font-semibold">Simpan Draft</button>
          <button id="btnPreviewDoc" class="px-4 py-2 rounded-lg bg-gray-200 dark:bg-gray-700 text-sm font-semibold">Pratinjau</button>
          <button id="btnCancelForm" class="px-4 py-2 rounded-lg text-sm">Batal</button>
        </div>
      </section>

      <!-- PREVIEW -->
      <section id="view-preview" class="hidden space-y-3">
        <div class="flex flex-wrap gap-2 no-print">
          <button id="btnBackFromPreview" class="px-3 py-1.5 rounded-lg bg-gray-200 dark:bg-gray-700 text-sm">← Kembali</button>
          <button id="btnPrint" class="px-3 py-1.5 rounded-lg bg-gray-800 text-white text-sm">🖨 Cetak / PDF Browser</button>
          <button id="btnGenDocs" class="px-3 py-1.5 rounded-lg bg-blue-600 text-white text-sm">📄 Generate Google Docs</button>
          <button id="btnGenPdf" class="px-3 py-1.5 rounded-lg bg-rose-600 text-white text-sm">⬇ Download PDF</button>
          <button id="btnSubmitReview" class="px-3 py-1.5 rounded-lg bg-amber-500 text-white text-sm">Kirim Review</button>
          <button id="btnApproveDoc" class="px-3 py-1.5 rounded-lg bg-emerald-600 text-white text-sm">Setujui</button>
          <button id="btnRejectDoc" class="px-3 py-1.5 rounded-lg bg-red-600 text-white text-sm">Tolak</button>
        </div>
        <div class="overflow-x-auto"><div id="printArea" class="page-a4 p-10 text-sm"></div></div>
      </section>

      <!-- CMS DOCUMENT TYPES -->
      <section id="view-doctypes" class="hidden space-y-3">
        <div class="flex justify-between"><h3 class="font-semibold">Jenis Dokumen</h3><button id="btnNewDocType" class="px-4 py-1.5 rounded-lg bg-indigo-600 text-white text-sm font-semibold">+ Jenis Baru</button></div>
        <div id="docTypeList" class="grid grid-cols-1 md:grid-cols-2 gap-3"></div>
      </section>

      <!-- USERS -->
      <section id="view-users" class="hidden space-y-3">
        <div class="flex justify-between"><h3 class="font-semibold">Manajemen User</h3><button id="btnNewUser" class="px-4 py-1.5 rounded-lg bg-indigo-600 text-white text-sm font-semibold">+ User Baru</button></div>
        <div id="gridUsers" class="ag-theme-quartz" style="height:480px;width:100%"></div>
      </section>

      <!-- SETTINGS -->
      <section id="view-settings" class="hidden max-w-xl space-y-3">
        <div class="bg-white dark:bg-gray-800 rounded-xl p-4 shadow space-y-3">
          <label class="text-xs font-semibold">Judul Situs</label>
          <input id="cfgSiteTitle" class="w-full px-3 py-2 rounded-lg border dark:bg-gray-700 dark:border-gray-600 text-sm">
          <label class="text-xs font-semibold">Nama Perusahaan</label>
          <input id="cfgCompanyName" class="w-full px-3 py-2 rounded-lg border dark:bg-gray-700 dark:border-gray-600 text-sm">
          <label class="text-xs font-semibold">URL Logo</label>
          <input id="cfgLogoUrl" class="w-full px-3 py-2 rounded-lg border dark:bg-gray-700 dark:border-gray-600 text-sm">
          <label class="text-xs font-semibold flex items-center gap-2"><input type="checkbox" id="cfgEmailNotif"> Aktifkan Notifikasi Email</label>
          <button id="btnSaveSettings" class="px-4 py-2 rounded-lg bg-indigo-600 text-white text-sm font-semibold">Simpan Pengaturan</button>
        </div>
      </section>

    </main>
  </div>
</div>

<!-- MODAL: Document Type editor -->
<div id="modalDocType" class="hidden fixed inset-0 bg-black/50 z-40 flex items-center justify-center p-4">
  <div class="bg-white dark:bg-gray-800 rounded-2xl shadow-xl w-full max-w-2xl max-h-[90vh] overflow-y-auto p-5 space-y-3">
    <h3 class="font-bold">Editor Jenis Dokumen</h3>
    <div class="grid grid-cols-2 gap-2">
      <input id="dtCode" placeholder="Kode (mis. RFC)" class="px-3 py-2 rounded-lg border dark:bg-gray-700 dark:border-gray-600 text-sm">
      <input id="dtName" placeholder="Nama Dokumen" class="px-3 py-2 rounded-lg border dark:bg-gray-700 dark:border-gray-600 text-sm">
      <input id="dtCategory" placeholder="Kategori" class="px-3 py-2 rounded-lg border dark:bg-gray-700 dark:border-gray-600 text-sm">
      <input id="dtNumbering" placeholder="Format No. mis RFC/{YYYY}/{SEQ}" class="px-3 py-2 rounded-lg border dark:bg-gray-700 dark:border-gray-600 text-sm">
    </div>
    <div class="border-t dark:border-gray-700 pt-2">
      <div class="flex justify-between items-center"><h4 class="text-sm font-semibold">Section / Field</h4><button id="btnAddSection" class="text-xs px-2 py-1 bg-indigo-600 text-white rounded-lg">+ Tambah Field</button></div>
      <div id="sectionBuilder" class="space-y-2 mt-2"></div>
    </div>
    <div class="border-t dark:border-gray-700 pt-2 grid grid-cols-2 gap-2 text-sm">
      <div><label class="text-xs">Ukuran Kertas</label>
        <select id="ltPageSize" class="w-full px-2 py-1.5 rounded-lg border dark:bg-gray-700 dark:border-gray-600"><option>A4</option><option>Letter</option></select></div>
      <div><label class="text-xs">Font</label>
        <select id="ltFont" class="w-full px-2 py-1.5 rounded-lg border dark:bg-gray-700 dark:border-gray-600"><option>Arial</option><option>Times New Roman</option><option>Calibri</option></select></div>
      <div><label class="text-xs">Ukuran Font</label><input id="ltFontSize" type="number" value="11" class="w-full px-2 py-1.5 rounded-lg border dark:bg-gray-700 dark:border-gray-600"></div>
      <div><label class="text-xs">Margin (cm)</label><input id="ltMargin" type="number" value="2.5" step="0.1" class="w-full px-2 py-1.5 rounded-lg border dark:bg-gray-700 dark:border-gray-600"></div>
      <div class="col-span-2"><label class="text-xs">Teks Header</label><input id="ltHeaderText" class="w-full px-2 py-1.5 rounded-lg border dark:bg-gray-700 dark:border-gray-600"></div>
      <div class="col-span-2"><label class="text-xs">Teks Footer</label><input id="ltFooterText" class="w-full px-2 py-1.5 rounded-lg border dark:bg-gray-700 dark:border-gray-600"></div>
    </div>
    <div class="flex gap-2 pt-2">
      <button id="btnSaveDocType" class="px-4 py-2 rounded-lg bg-indigo-600 text-white text-sm font-semibold">Simpan</button>
      <button id="btnCloseDocType" class="px-4 py-2 rounded-lg text-sm">Batal</button>
    </div>
  </div>
</div>

<!-- MODAL: User editor -->
<div id="modalUser" class="hidden fixed inset-0 bg-black/50 z-40 flex items-center justify-center p-4">
  <div class="bg-white dark:bg-gray-800 rounded-2xl shadow-xl w-full max-w-sm p-5 space-y-2">
    <h3 class="font-bold">Editor User</h3>
    <input id="uFullName" placeholder="Nama Lengkap" class="w-full px-3 py-2 rounded-lg border dark:bg-gray-700 dark:border-gray-600 text-sm">
    <input id="uUsername" placeholder="Username" class="w-full px-3 py-2 rounded-lg border dark:bg-gray-700 dark:border-gray-600 text-sm">
    <input id="uEmail" placeholder="Email" class="w-full px-3 py-2 rounded-lg border dark:bg-gray-700 dark:border-gray-600 text-sm">
    <input id="uPassword" type="password" placeholder="Password (kosongkan jika tidak diubah)" class="w-full px-3 py-2 rounded-lg border dark:bg-gray-700 dark:border-gray-600 text-sm">
    <select id="uRole" class="w-full px-3 py-2 rounded-lg border dark:bg-gray-700 dark:border-gray-600 text-sm"><option>Admin</option><option>Editor</option><option>Viewer</option></select>
    <label class="text-xs flex items-center gap-2"><input type="checkbox" id="uActive" checked> Aktif</label>
    <div class="flex gap-2 pt-2">
      <button id="btnSaveUser" class="px-4 py-2 rounded-lg bg-indigo-600 text-white text-sm font-semibold">Simpan</button>
      <button id="btnCloseUser" class="px-4 py-2 rounded-lg text-sm">Batal</button>
    </div>
  </div>
</div>

<script>window.GAS_URL = "<?= gasUrl ?>";</script>
<?!= include('JavaScript') ?>
</body>
</html>
