<!DOCTYPE html>
<html lang="en" class="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DevDocGen Enterprise</title>
  
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/ag-grid-community/dist/ag-grid-community.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/ag-charts-community/dist/ag-charts-community.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

  <script>
    tailwind.config={darkMode:"class",theme:{extend:{colors:{primary:"#1A237E",secondary:"#2563EB",background:"#f8f9ff","surface-container-low":"#eff4ff","surface-container-lowest":"#ffffff"}}}};
  </script>
</head>
<body class="bg-background text-gray-800 dark:bg-gray-900 dark:text-gray-100 font-[Inter] antialiased min-h-screen selection:bg-secondary selection:text-white">

  <!-- ==================== LOGIN VIEW ==================== -->
  <div id="view-login" class="flex min-h-screen items-center justify-center p-4 bg-surface-container-low dark:bg-gray-800">
    <div class="bg-surface-container-lowest dark:bg-gray-900 p-8 rounded-xl shadow-lg w-full max-w-sm border border-gray-100 dark:border-gray-700">
      <div class="flex items-center gap-2 mb-6 justify-center">
        <span class="material-symbols-outlined text-primary dark:text-blue-400 text-3xl">schema</span>
        <h2 class="text-2xl font-bold text-primary dark:text-blue-400 tracking-tight">DevDocGen</h2>
      </div>
      <div class="flex flex-col gap-4">
        <input type="email" id="log-email" class="h-10 px-3 border border-gray-300 dark:border-gray-700 bg-gray-50 dark:bg-gray-800 rounded-lg focus:outline-none focus:ring-2 focus:ring-secondary" placeholder="admin@devdoc.com" value="admin@devdoc.com">
        <input type="password" id="log-pass" class="h-10 px-3 border border-gray-300 dark:border-gray-700 bg-gray-50 dark:bg-gray-800 rounded-lg focus:outline-none focus:ring-2 focus:ring-secondary" placeholder="Password" value="Admin123!">
        <button type="button" onclick="app.login()" id="btn-login" class="h-10 mt-2 bg-primary text-white rounded-lg font-semibold shadow-sm hover:bg-blue-800 transition-all flex items-center justify-center">
          Login ke Workspace
        </button>
      </div>
    </div>
  </div>

  <!-- ==================== MAIN WORKSPACE ==================== -->
  <!-- PERHATIKAN: Secara default disembunyikan menggunakan 'hidden' Tailwind -->
  <div id="view-main" class="hidden min-h-screen flex-col md:flex-row">
    
    <!-- Sidebar -->
    <aside class="w-full md:w-64 bg-surface-container-lowest dark:bg-gray-900 z-50 flex flex-col justify-between shadow-md border-r dark:border-gray-700 h-screen sticky top-0">
      <div class="flex flex-col">
        <div class="h-16 px-4 flex items-center gap-3 bg-surface-container-low dark:bg-gray-800 border-b border-gray-200 dark:border-gray-700">
          <span class="material-symbols-outlined text-primary dark:text-blue-400 text-3xl">auto_awesome</span>
          <div class="flex flex-col leading-none">
            <span class="text-primary dark:text-blue-400 font-bold tracking-tight">DevDocGen</span>
            <span class="text-[10px] text-gray-500 uppercase tracking-wider mt-0.5">Enterprise v2.4</span>
          </div>
        </div>
        <nav id="sidebar-nav" class="flex flex-col gap-1 p-2 mt-2"></nav>
      </div>
      <div class="p-4 border-t border-gray-200 dark:border-gray-700">
         <div class="flex flex-col mb-4 leading-tight">
           <span class="text-xs text-gray-500 uppercase">Active Session</span>
           <span id="lbl-name" class="font-bold">User</span>
           <span id="lbl-role" class="text-xs text-secondary mt-1">Role</span>
         </div>
         <button type="button" onclick="app.logout()" class="w-full h-8 bg-red-100 text-red-600 rounded text-xs font-bold hover:bg-red-200">Logout</button>
      </div>
    </aside>

    <!-- Main Content Area -->
    <div class="flex-1 flex flex-col min-w-0">
      <header class="h-16 bg-white dark:bg-gray-900 border-b border-gray-200 dark:border-gray-700 flex items-center justify-between px-6 shadow-sm sticky top-0 z-40">
        <h1 class="font-bold text-lg text-gray-800 dark:text-gray-200" id="header-title">Dashboard</h1>
        <button onclick="app.toggleDark()" class="w-9 h-9 rounded-lg hover:bg-gray-100 dark:hover:bg-gray-800 flex items-center justify-center"><span class="material-symbols-outlined">dark_mode</span></button>
      </header>

      <main class="flex-1 p-6 overflow-y-auto">
        <!-- MODULE: DASHBOARD -->
        <div id="module-dashboard" class="app-module block">
          <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-6">
            <div class="bg-white dark:bg-gray-900 p-6 rounded-xl shadow border-l-4 border-primary">
              <span class="text-xs uppercase text-gray-500 font-bold">Total Dokumen (GAS Sync)</span>
              <div class="text-3xl font-bold mt-2" id="dash-total">Memuat...</div>
            </div>
          </div>
          <div class="bg-white dark:bg-gray-900 rounded-xl p-6 shadow h-96 flex flex-col">
            <h2 class="text-lg font-semibold mb-4">Database Documents (AG Grid)</h2>
            <div id="ag-grid-documents" class="ag-theme-alpine dark:ag-theme-alpine-dark w-full flex-1"></div>
          </div>
        </div>

        <!-- MODULE: DOCUMENTS (Placeholder untuk modul lain) -->
        <div id="module-documents" class="app-module hidden">
           <div class="bg-white dark:bg-gray-900 rounded-xl p-6 shadow h-96 flex flex-col">
            <h2 class="text-lg font-semibold mb-4">Halaman Dokumen (Arsip Lengkap)</h2>
            <p>Konten arsip akan dirender di sini.</p>
          </div>
        </div>
      </main>
    </div>
  </div>

  <script src="app.min.js"></script>
</body>
</html>
