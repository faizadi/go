<!DOCTYPE html>
<html lang="id" class="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DevDocGen - Enterprise App</title>

  <!-- CDN Dependencies -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/ag-grid-community/dist/ag-grid-community.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/ag-charts-community/dist/ag-charts-community.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: { extend: { colors: { primary: '#2563eb' } } }
    }
  </script>
  <style>
    /* Material UI Elevations & Transitions */
    .btn { @apply px-4 py-2 rounded shadow transition duration-200 transform hover:scale-105 active:scale-95; }
    .btn-primary { @apply bg-primary text-white hover:bg-blue-700; }
    .glass-panel { @apply bg-white dark:bg-gray-800 shadow-lg rounded-xl border border-gray-200 dark:border-gray-700; }
    #ag-grid-container { height: 400px; width: 100%; }
  </style>
</head>
<body class="bg-gray-50 dark:bg-gray-900 text-gray-800 dark:text-gray-200 transition-colors duration-300">

  <!-- Login View -->
  <div id="login-view" class="min-h-screen flex items-center justify-center p-4">
    <div class="glass-panel p-8 w-full max-w-md">
      <h2 class="text-2xl font-bold text-center mb-6">DevDocGen Login</h2>
      <input type="email" id="log-email" placeholder="Email" class="w-full mb-4 p-3 border rounded dark:bg-gray-700 dark:border-gray-600 outline-none focus:border-primary">
      <input type="password" id="log-pass" placeholder="Password" class="w-full mb-6 p-3 border rounded dark:bg-gray-700 dark:border-gray-600 outline-none focus:border-primary">
      <button onclick="app.login()" class="btn btn-primary w-full">Sign In</button>
    </div>
  </div>

  <!-- Main View (SPA) -->
  <div id="main-view" class="hidden min-h-screen flex flex-col md:flex-row">

    <!-- Sidebar -->
    <aside class="w-full md:w-64 glass-panel m-2 flex flex-col rounded-xl overflow-hidden">
      <div class="p-4 bg-primary text-white font-bold flex justify-between items-center">
        <span><i class="fas fa-layer-group mr-2"></i> DevDocGen</span>
        <button onclick="app.toggleTheme()" class="md:hidden"><i class="fas fa-moon"></i></button>
      </div>
      <nav id="sidebar-nav" class="flex-1 p-2 space-y-1">
        <!-- Rendered by JS based on Role -->
      </nav>
      <div class="p-4 border-t dark:border-gray-700 text-sm">
        <p id="user-info" class="font-bold mb-2">User</p>
        <button onclick="app.logout()" class="text-red-500 hover:text-red-700 w-full text-left"><i class="fas fa-sign-out-alt mr-2"></i>Logout</button>
      </div>
    </aside>

    <!-- Content Area -->
    <main class="flex-1 p-4 overflow-y-auto">
      <div class="flex justify-between items-center mb-6">
        <h1 id="page-title" class="text-2xl font-bold">Dashboard</h1>
        <button onclick="app.toggleTheme()" class="hidden md:block btn bg-gray-200 dark:bg-gray-700 text-gray-800 dark:text-gray-200"><i class="fas fa-adjust"></i> Toggle Theme</button>
      </div>

      <!-- Sections -->
      <div id="section-dashboard" class="spa-section">
        <div class="glass-panel p-4 h-96" id="dashboard-chart"></div>
      </div>

      <div id="section-generator" class="spa-section hidden">
        <div class="grid grid-cols-1 lg:grid-cols-2 gap-4">
          <div class="glass-panel p-6">
            <h3 class="font-bold mb-4">1. Setup Dokumen</h3>
            <label class="block mb-2 text-sm">Judul Dokumen</label>
            <input type="text" id="doc-title" class="w-full mb-4 p-2 border rounded dark:bg-gray-700 dark:border-gray-600 outline-none">
            <label class="block mb-2 text-sm">Pilih Template (RFC, BRD, dll)</label>
            <select id="doc-template-select" onchange="app.renderDynamicForm()" class="w-full mb-4 p-2 border rounded dark:bg-gray-700 dark:border-gray-600 outline-none">
              <option value="">-- Pilih --</option>
            </select>
            <div id="dynamic-form-container" class="space-y-3 border-t dark:border-gray-700 pt-4 mt-2"></div>
            <button onclick="app.generateDocument()" class="btn btn-primary w-full mt-6"><i class="fas fa-magic mr-2"></i> Generate & Save to Drive</button>
          </div>
          <div class="glass-panel p-6 flex flex-col">
            <h3 class="font-bold mb-4">2. Live Preview</h3>
            <div id="doc-preview" class="flex-1 p-4 border dark:border-gray-600 rounded bg-white text-black overflow-y-auto whitespace-pre-wrap font-mono text-sm">
              Pilih template dan isi form untuk melihat preview.
            </div>
          </div>
        </div>
      </div>

      <div id="section-templates" class="spa-section hidden glass-panel p-6">
        <div class="flex justify-between mb-4">
          <h3 class="font-bold">Manajemen Template (CMS)</h3>
          <button onclick="app.openTemplateModal()" class="btn btn-primary"><i class="fas fa-plus"></i> Template Baru</button>
        </div>
        <div id="grid-templates" class="ag-theme-alpine w-full h-80 transition-colors"></div>
      </div>

      <div id="section-documents" class="spa-section hidden glass-panel p-6">
        <h3 class="font-bold mb-4">Arsip Dokumen (Drive Sync)</h3>
        <div id="grid-documents" class="ag-theme-alpine w-full h-96 transition-colors"></div>
      </div>

    </main>
  </div>

  <!-- Modal Template -->
  <div id="modal-template" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center p-4 z-50">
    <div class="glass-panel w-full max-w-2xl p-6 relative">
      <button onclick="document.getElementById('modal-template').classList.add('hidden')" class="absolute top-4 right-4 text-gray-500 hover:text-red-500"><i class="fas fa-times"></i></button>
      <h3 class="font-bold mb-4">Tambah Template Baru</h3>
      <input type="text" id="tpl-name" placeholder="Nama (ex: Project Plan)" class="w-full mb-4 p-2 border rounded dark:bg-gray-700 dark:border-gray-600">
      <p class="text-xs text-gray-500 mb-2">Gunakan format <code class="bg-gray-200 dark:bg-gray-600 px-1 rounded">{{NAMA_VARIABEL}}</code> untuk field dinamis.</p>
      <textarea id="tpl-content" rows="10" placeholder="Maksud dan tujuan: {{TUJUAN}}..." class="w-full mb-4 p-2 border rounded dark:bg-gray-700 dark:border-gray-600"></textarea>
      <button onclick="app.saveTemplate()" class="btn btn-primary w-full">Simpan Template</button>
    </div>
  </div>

  <!-- Load Minified Logic -->
  <script src="app.min.js"></script>
</body>
</html>
