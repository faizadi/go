<!DOCTYPE html>
<html lang="en" class="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DevDocGen Enterprise v3.0</title>
  
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/ag-grid-community/dist/ag-grid-community.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/ag-charts-community/dist/ag-charts-community.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

  <script>
    tailwind.config={darkMode:"class",theme:{extend:{colors:{primary:"#1A237E",secondary:"#2563EB",background:"#f8f9ff"}}}};
  </script>
</head>
<body class="bg-background text-gray-800 dark:bg-gray-900 dark:text-gray-100 font-[Inter] antialiased min-h-screen">

  <!-- ==================== LOGIN VIEW ==================== -->
  <div id="view-login" class="flex min-h-screen items-center justify-center p-4">
    <div class="bg-white dark:bg-gray-800 p-8 rounded-xl shadow-lg w-full max-w-sm border border-gray-100 dark:border-gray-700">
      <div class="flex items-center gap-2 mb-6 justify-center">
        <span class="material-symbols-outlined text-primary dark:text-blue-400 text-3xl">schema</span>
        <h2 class="text-2xl font-bold text-primary dark:text-blue-400">DevDocGen</h2>
      </div>
      <div class="flex flex-col gap-4">
        <input type="email" id="log-email" class="h-10 px-3 border border-gray-300 dark:border-gray-700 bg-gray-50 dark:bg-gray-900 rounded-lg focus:outline-none focus:ring-2 focus:ring-secondary" placeholder="admin@devdoc.com" value="admin@devdoc.com">
        <input type="password" id="log-pass" class="h-10 px-3 border border-gray-300 dark:border-gray-700 bg-gray-50 dark:bg-gray-900 rounded-lg focus:outline-none focus:ring-2 focus:ring-secondary" placeholder="Password" value="Admin123!">
        <button type="button" onclick="app.login()" id="btn-login" class="h-10 mt-2 bg-primary text-white rounded-lg font-semibold shadow-sm hover:bg-blue-800 transition-all">
          Authenticate
        </button>
      </div>
    </div>
  </div>

  <!-- ==================== MAIN WORKSPACE ==================== -->
  <div id="view-main" class="hidden min-h-screen flex-col md:flex-row">
    <!-- Sidebar -->
    <aside class="w-full md:w-64 bg-white dark:bg-gray-900 z-50 flex flex-col justify-between shadow-md border-r dark:border-gray-700 md:h-screen md:sticky md:top-0">
      <div class="flex flex-col">
        <div class="h-16 px-4 flex items-center gap-3 bg-gray-50 dark:bg-gray-800 border-b dark:border-gray-700">
          <span class="material-symbols-outlined text-primary dark:text-blue-400 text-3xl">auto_awesome</span>
          <div class="flex flex-col leading-none">
            <span class="text-primary dark:text-blue-400 font-bold">DevDocGen</span>
            <span class="text-[10px] text-gray-500 uppercase tracking-wider">Enterprise v3.0</span>
          </div>
        </div>
        <nav id="sidebar-nav" class="flex flex-col gap-1 p-2 mt-2"></nav>
      </div>
      <div class="p-4 border-t dark:border-gray-700 bg-gray-50 dark:bg-gray-800">
         <div class="flex flex-col mb-4">
           <span class="text-xs text-gray-500 uppercase">Session Active</span>
           <span id="lbl-name" class="font-bold text-sm">User</span>
           <span id="lbl-role" class="text-[10px] font-mono text-secondary mt-1">Role</span>
         </div>
         <button type="button" onclick="app.logout()" class="w-full h-8 bg-red-100 text-red-600 rounded text-xs font-bold hover:bg-red-200">System Logout</button>
      </div>
    </aside>

    <!-- Content -->
    <div class="flex-1 flex flex-col min-w-0">
      <header class="h-16 bg-white dark:bg-gray-900 border-b border-gray-200 dark:border-gray-700 flex items-center justify-between px-6 shadow-sm sticky top-0 z-40">
        <h1 class="font-bold text-lg" id="header-title">Dashboard</h1>
        <button onclick="app.toggleDark()" class="w-9 h-9 rounded-lg hover:bg-gray-100 dark:hover:bg-gray-800 flex items-center justify-center text-gray-500"><span class="material-symbols-outlined">dark_mode</span></button>
      </header>

      <main class="flex-1 p-6 overflow-y-auto">
        <!-- MODULE: DASHBOARD -->
        <div id="module-dashboard" class="app-module block">
          <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-6">
            <div class="bg-white dark:bg-gray-800 p-6 rounded-xl shadow border-l-4 border-primary">
              <span class="text-xs uppercase text-gray-500 font-bold">Total Artifacts</span>
              <div class="text-3xl font-bold mt-2 text-primary dark:text-blue-400" id="dash-total">...</div>
            </div>
          </div>
          <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
            <div class="bg-white dark:bg-gray-800 rounded-xl p-6 shadow h-96 flex flex-col">
              <h2 class="text-base font-semibold mb-2">Category Distribution</h2>
              <div id="ag-chart-container" class="w-full flex-1"></div>
            </div>
          </div>
        </div>

        <!-- MODULE: GENERATOR (Drive File Upload Implementation) -->
        <div id="module-generator" class="app-module hidden">
          <div class="bg-white dark:bg-gray-800 rounded-xl p-6 shadow max-w-3xl">
             <h2 class="text-lg font-semibold mb-4 border-b dark:border-gray-700 pb-2">Document Generator</h2>
             <div class="flex flex-col gap-4">
                <div>
                  <label class="block text-xs font-bold text-gray-500 uppercase mb-1">Judul Dokumen</label>
                  <input type="text" id="gen-title" class="w-full h-10 px-3 bg-gray-50 dark:bg-gray-900 border dark:border-gray-700 rounded-lg focus:outline-none" placeholder="RFC - Sistem Pembayaran">
                </div>
                <div>
                  <label class="block text-xs font-bold text-gray-500 uppercase mb-1">Master Template</label>
                  <select id="gen-template" class="w-full h-10 px-3 bg-gray-50 dark:bg-gray-900 border dark:border-gray-700 rounded-lg focus:outline-none"></select>
                </div>
                <div>
                  <label class="block text-xs font-bold text-gray-500 uppercase mb-1">Lampiran Referensi (Opsional)</label>
                  <input type="file" id="gen-file" class="w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-sm file:font-semibold file:bg-blue-50 file:text-secondary hover:file:bg-blue-100 dark:file:bg-gray-700 dark:file:text-white">
                </div>
                <button type="button" onclick="app.generateDoc()" id="btn-generate" class="h-10 mt-4 bg-secondary text-white rounded-lg font-semibold shadow hover:bg-blue-700 flex items-center justify-center gap-2">
                  <span class="material-symbols-outlined text-sm">cloud_upload</span> Compile & Save to Drive
                </button>
             </div>
          </div>
        </div>

        <!-- MODULE: DOCUMENTS (AG GRID) -->
        <div id="module-documents" class="app-module hidden flex-col h-[calc(100vh-140px)]">
           <div class="bg-white dark:bg-gray-800 rounded-xl p-6 shadow flex flex-col h-full">
            <h2 class="text-lg font-semibold mb-4">Enterprise Repository</h2>
            <div id="ag-grid-documents" class="ag-theme-alpine dark:ag-theme-alpine-dark w-full flex-1"></div>
          </div>
        </div>
      </main>
    </div>
  </div>

  <script src="app.min.js"></script>
</body>
</html>
